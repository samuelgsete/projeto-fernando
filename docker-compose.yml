services:
  api:
    build:
      context: .
      dockerfile: backend/backend.Dockerfile
    container_name: dr_tilapia_api_dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: dr_tilapia_frontend_dev
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://api:8000
    depends_on:
      - api
    restart: always
